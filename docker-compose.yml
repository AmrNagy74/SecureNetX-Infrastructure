version: '3.8'

services:
  # 1. Database Service (PostgreSQL + TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: securenetx_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: securenetx_logs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. MLflow Tracking Server (AI Model Tracking & Registry)
  mlflow:
    image: python:3.11-slim
    container_name: securenetx_mlflow
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000"
    restart: unless-stopped

  # 3. Backend & AI Inference API (FastAPI + ONNX Runtime)
  backend:
    image: python:3.11-slim
    container_name: securenetx_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # 4. Frontend Dashboard (React + Vite + Tailwind CSS)
  frontend:
    image: node:20-alpine
    container_name: securenetx_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
